# Minimal CI: repo hygiene plus the full local pytest suite (all phases).
# Lint job is added later; tests run in the test job below.
name: ci # workflow name shown in the Actions tab

on: # triggers
  push: # run on every push
    branches: [main] # only the main branch
  pull_request: # and on pull requests

jobs: # job definitions
  hygiene: # verify no local-only or secret files are tracked
    runs-on: ubuntu-26.04        # pinned: last CI run passed on 26.04; never ubuntu-latest (guard job)
    steps: # ordered steps
      - uses: actions/checkout@v7 # fetch the repository
      - run: make check-hygiene # fail if .env, CLAUDE.md or workflow_status files are tracked
  test: # full pytest suite: unit, SQL and reference checks (no Databricks workspace)
    runs-on: ubuntu-26.04        # pinned: last CI run passed on 26.04; never ubuntu-latest (guard job)
    steps: # ordered steps
      - uses: actions/checkout@v7 # fetch the repository
      - uses: actions/setup-python@v7 # install Python
        with: # setup options
          python-version: "3.11" # matches local 3.11.6
      - run: python -m pip install -r requirements-dev.txt # pytest + PyYAML
      - run: python -m pytest -q # run the suite

  # ── Runner pin guard ────────────────────────────────────────────────────
  # ubuntu-latest moved from 24.04 to 26.04 in Oct-Nov 2026 and broke an R
  # build in another repo. Every job must name an exact image; this job fails
  # if any workflow uses a moving "-latest" runner label.
  runner-pin-guard:
    name: Runner pin guard                                   # label shown in the Actions UI
    runs-on: ubuntu-26.04        # pinned: last CI run passed on 26.04; never ubuntu-latest (guard job)
    steps:
      - uses: actions/checkout@v7                                     # check out the workflow files
      - name: Fail on moving runner labels                   # the fail-safe check
        run: |                                               # bash step
          echo "::notice::Runner image $ImageOS $ImageVersion"   # record which image ran
          if grep -rnE '^[^#]*(ubuntu|windows|macos)-latest' .github/workflows; then  # any -latest label outside a comment (runs-on or matrix)?
            echo "::error::Pin runners to an exact image (e.g. ubuntu-24.04), never *-latest"   # explain the failure
            exit 1                                           # fail the job
          fi                                                 # end of check
