# ── Databricks Asset Bundle root (workspace host comes from the CLI profile, never this file) ──
bundle:                  # bundle metadata
  name: fraud-detection  # bundle name shown in the workspace

variables:               # one place for the project location, shared by the job and the pipeline
  catalog:               # Unity Catalog catalog
    default: workspace   # Free Edition default catalog
  schema:                # project schema (Bronze and Silver live here)
    default: fraud       # created by sql/10_fraud_ingest_setup.sql
  warehouse_id:          # SQL warehouse for the Gold SQL tasks (no ID in this public repo)
    description: Found by name when the bundle deploys; edit the name if your warehouse is called something else  # how to change it
    lookup:              # resolve an ID from a name at deploy time
      warehouse: "Serverless Starter Warehouse"  # the exact warehouse name, confirmed in the workspace 2026-10-11 (G1d)

include:                 # extra resource files to load
  - resources/*.yml      # job definitions live under resources/

targets:                 # deployment targets
  dev:                   # the only target: Databricks Free Edition
    default: true        # used when no -t flag is given
    mode: development    # per-user copies; schedules stay paused
