# ── Job: release, ingest, refresh Silver, score, raise Gold alerts, then rebuild the monitoring views and refresh both dashboards (ADR 0007-0012); no export task: R2 is unreachable from Free Edition ──
resources:                                        # bundle resources
  jobs:                                           # job resources
    fraud_ingest:                                 # resource key (used in tests)
      name: fraud-ingest                          # job name in the workspace
      max_concurrent_runs: 1                      # never overlap release runs
      schedule:                                   # hands-off demo schedule
        quartz_cron_expression: "0 0/10 * * * ?"  # every 10 minutes
        timezone_id: UTC                          # schedule clock
        pause_status: PAUSED                      # off until the user enables it (quota unconfirmed, G-08)
      parameters:                                 # job parameters, pushed to notebook widgets of the same name
        - name: catalog                           # Unity Catalog catalog (change via the bundle variable, not at Run now)
          default: ${var.catalog}                 # same value the Silver pipeline is deployed with
        - name: schema                            # project schema (change via the bundle variable, not at Run now)
          default: ${var.schema}                  # same value the Silver pipeline is deployed with
        - name: steps_per_run                     # K
          default: "6"                            # 72 replay steps = 12 runs
        - name: segment                           # replay or drift
          default: replay                         # drift only when chosen
        - name: duplicate_step                    # duplicate-file scenario
          default: ""                             # off
        - name: hold_steps                        # late-file scenario, part 1
          default: ""                             # off
        - name: release_held                      # late-file scenario, part 2
          default: ""                             # off
        - name: schema_change_from_step           # schema-change scenario
          default: ""                             # off
        - name: malformed_step                    # malformed-values scenario: target step
          default: ""                             # off
        - name: malformed_rows                    # malformed-values scenario: row count
          default: ""                             # off
        - name: score_from_step                   # first step the score task considers (training data ends at 336)
          default: "337"                          # equals SCORE_FROM_STEP_DEFAULT
        - name: model_alias                       # which registered model version scores
          default: champion                       # set only by notebooks/06_promote_model.py
      tasks:                                      # task graph
        - task_key: release                       # copy the next steps to landing
          notebook_task:                          # runs a notebook on serverless (no cluster block)
            notebook_path: ../notebooks/02_release.py  # path relative to this file
        - task_key: ingest                        # Auto Loader into Bronze
          depends_on:                             # ordering
            - task_key: release                   # after release finishes
          max_retries: 1                          # one automatic retry for the UnknownFieldException restart
          min_retry_interval_millis: 10000        # wait 10 s before retrying
          notebook_task:                          # runs a notebook on serverless
            notebook_path: ../notebooks/03_ingest_bronze.py  # path relative to this file
        - task_key: silver                        # Silver pipeline refresh
          depends_on:                             # ordering
            - task_key: ingest                    # after Bronze is up to date
          pipeline_task:                          # runs the bundle's Lakeflow pipeline (serverless)
            pipeline_id: ${resources.pipelines.fraud_silver.id}  # resolved at deploy time; no ID in the repo
            full_refresh: false                   # incremental by default; full refresh only by hand after a reset
        - task_key: score                         # fraud risk scores for new payments
          depends_on:                             # ordering
            - task_key: silver                    # after the features are refreshed
          notebook_task:                          # serverless notebook (no cluster block)
            notebook_path: ../notebooks/05_score_transactions.py  # path relative to this file
        - task_key: gold                          # alerts, cases and verdicts (ADR 0010)
          depends_on:                             # ordering
            - task_key: score                     # after the new payments are scored
          sql_task:                               # runs a SQL file on the SQL warehouse
            warehouse_id: ${var.warehouse_id}     # looked up by name at deploy time
            file:                                 # the SQL file to run
              path: ../sql/gold/gold.sql          # path relative to this file
        - task_key: monitor                       # rebuild the six monitoring views (ADR 0012)
          depends_on:                             # ordering
            - task_key: gold                      # after alerts and cases are current; can never hurt Gold
          sql_task:                               # runs a SQL file on the SQL warehouse
            warehouse_id: ${var.warehouse_id}     # looked up by name at deploy time
            file:                                 # the SQL file to run
              path: ../sql/monitoring/monitoring.sql  # path relative to this file
        - task_key: refresh_operations            # refresh the Fraud operations dashboard (exam 4.2 dashboard task)
          depends_on:                             # ordering
            - task_key: monitor                   # after the views are rebuilt
          dashboard_task:                         # refreshes as the job's run-as identity (ruling R1)
            dashboard_id: ${resources.dashboards.fraud_operations.id}  # resolved at deploy time; no ID in the repo
            warehouse_id: ${var.warehouse_id}     # looked up by name at deploy time
        - task_key: refresh_platform              # refresh the Platform health dashboard
          depends_on:                             # ordering
            - task_key: monitor                   # after the views are rebuilt
          dashboard_task:                         # refreshes as the job's run-as identity (ruling R1)
            dashboard_id: ${resources.dashboards.platform_health.id}  # resolved at deploy time; no ID in the repo
            warehouse_id: ${var.warehouse_id}     # looked up by name at deploy time
