# ── Dashboards: Fraud operations (all three groups) and Platform health (engineers only). Phase 6a spec §5.2, ADR 0012 ──
# Both run every query with the viewer's own credentials, so grants, the row filter and the masks apply per viewer.
# The JSON files are generated by scripts/build_dashboards.py; edit src/fraud_monitoring/dashboards.py instead.
resources:                                        # bundle resources
  dashboards:                                     # AI/BI dashboards
    fraud_operations:                             # resource key (used in tests and by refresh_operations)
      display_name: Fraud operations              # name shown in the workspace
      file_path: ../dashboards/fraud_operations.lvdash.json  # path relative to this file
      warehouse_id: ${var.warehouse_id}           # looked up by name at deploy time
      embed_credentials: false                    # viewer credentials: never the publisher's rights
      permissions:                                # who may open it (CAN_READ is "Can view" in the UI)
        - group_name: fraud_engineers             # engineers
          level: CAN_READ                         # view only
        - group_name: fraud_reviewers             # reviewers
          level: CAN_READ                         # view only
        - group_name: fraud_managers              # managers: closed cases only, names REDACTED (row filter, masks)
          level: CAN_READ                         # view only
    platform_health:                              # resource key (used in tests and by refresh_platform)
      display_name: Platform health               # name shown in the workspace
      file_path: ../dashboards/platform_health.lvdash.json  # path relative to this file
      warehouse_id: ${var.warehouse_id}           # looked up by name at deploy time
      embed_credentials: false                    # viewer credentials: the views are granted to engineers only
      permissions:                                # who may open it
        - group_name: fraud_engineers             # engineers only
          level: CAN_READ                         # view only
